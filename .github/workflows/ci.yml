name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: |
          npm install
        working-directory: ./task-manager-api-24DIT026
      - name: Run Automated Unit Tests
        run: |
          npm test
        working-directory: ./task-manager-api-24DIT026
