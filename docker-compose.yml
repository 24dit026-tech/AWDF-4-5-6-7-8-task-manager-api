version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_service
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./task-manager-api-24DIT026
    container_name: backend_service
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/taskDB
      - JWT_SECRET=supersecretjwtkey_24dit026_practical7
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./student-portfolio
    container_name: frontend_service
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
